<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Looping Humans by AI Portland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #202124;
    }

    .status {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .status.active {
      background: #e6f4ea;
      color: #1e8e3e;
    }

    .status.inactive {
      background: #fce8e6;
      color: #d93025;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-start {
      background: #1e8e3e;
      color: white;
    }

    .btn-start:hover:not(:disabled) {
      background: #188038;
    }

    .btn-end {
      background: #d93025;
      color: white;
    }

    .btn-end:hover:not(:disabled) {
      background: #b31412;
    }

    .message {
      padding: 0.75rem;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
    }

    .message.success {
      background: #e6f4ea;
      color: #1e8e3e;
      display: block;
    }

    .message.error {
      background: #fce8e6;
      color: #d93025;
      display: block;
    }

    .info {
      color: #5f6368;
      font-size: 0.875rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>🛠️ Event Admin</h1>

    <div id="status" class="status">
      Checking status...
    </div>

    <button id="start-btn" class="btn btn-start">
      Start Event
    </button>

    <button id="end-btn" class="btn btn-end">
      End Event
    </button>

    <div id="message" class="message"></div>

    <div class="info">
      <strong>Instructions:</strong><br>
      • Click "Start Event" to allow users to begin networking<br>
      • Click "End Event" to show closing message to all users<br>
      • Changes take effect immediately
    </div>
  </div>

  <script type="module">
    import { setEventState, getEventState, subscribeToEventState } from './src/supabase.js';

    // Password protection
    const ADMIN_PASSWORD = import.meta.env.VITE_ADMIN_PASSWORD;
    const AUTH_KEY = 'admin_authenticated';

    // Check if already authenticated
    if (sessionStorage.getItem(AUTH_KEY) !== 'true') {
      const password = prompt('Admin password required:');
      if (password !== ADMIN_PASSWORD) {
        alert('Incorrect password');
        window.location.href = '/';
        throw new Error('Authentication failed');
      }
      sessionStorage.setItem(AUTH_KEY, 'true');
    }

    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const endBtn = document.getElementById('end-btn');
    const messageDiv = document.getElementById('message');

    let currentState = null;

    // Update UI based on state
    function updateUI(isActive) {
      currentState = isActive;

      if (isActive) {
        statusDiv.className = 'status active';
        statusDiv.textContent = '✓ Event is active';
        startBtn.disabled = true;
        endBtn.disabled = false;
      } else {
        statusDiv.className = 'status inactive';
        statusDiv.textContent = '✕ Event has ended';
        startBtn.disabled = false;
        endBtn.disabled = true;
      }
    }

    // Show message
    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      setTimeout(() => {
        messageDiv.className = 'message';
      }, 3000);
    }

    // Load initial state
    async function loadState() {
      try {
        const state = await getEventState();
        if (state) {
          updateUI(state.is_active);
        } else {
          // No state found, default to inactive
          updateUI(false);
        }
      } catch (error) {
        console.error('Error loading state:', error);
        showMessage('Error loading event state', 'error');
      }
    }

    // Start event
    startBtn.addEventListener('click', async () => {
      try {
        startBtn.disabled = true;
        const success = await setEventState(true);
        if (success) {
          showMessage('Event started successfully!', 'success');
          updateUI(true);
        } else {
          showMessage('Failed to start event', 'error');
          startBtn.disabled = false;
        }
      } catch (error) {
        console.error('Error starting event:', error);
        showMessage('Error starting event', 'error');
        startBtn.disabled = false;
      }
    });

    // End event
    endBtn.addEventListener('click', async () => {
      if (!confirm('Are you sure you want to end the event? This will show the closing message to all users.')) {
        return;
      }

      try {
        endBtn.disabled = true;
        const success = await setEventState(false);
        if (success) {
          showMessage('Event ended successfully', 'success');
          updateUI(false);
        } else {
          showMessage('Failed to end event', 'error');
          endBtn.disabled = false;
        }
      } catch (error) {
        console.error('Error ending event:', error);
        showMessage('Error ending event', 'error');
        endBtn.disabled = false;
      }
    });

    // Subscribe to real-time changes
    subscribeToEventState((newState) => {
      if (newState && newState.is_active !== undefined) {
        updateUI(newState.is_active);
      }
    });

    // Initial load
    loadState();
  </script>
</body>
</html>
