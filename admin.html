<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Looping Humans by AI Portland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #202124;
    }

    .status {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .status.active {
      background: #e6f4ea;
      color: #1e8e3e;
    }

    .status.inactive {
      background: #fce8e6;
      color: #d93025;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-start {
      background: #1e8e3e;
      color: white;
    }

    .btn-start:hover:not(:disabled) {
      background: #188038;
    }

    .btn-end {
      background: #d93025;
      color: white;
    }

    .btn-end:hover:not(:disabled) {
      background: #b31412;
    }

    .message {
      padding: 0.75rem;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
    }

    .message.success {
      background: #e6f4ea;
      color: #1e8e3e;
      display: block;
    }

    .message.error {
      background: #fce8e6;
      color: #d93025;
      display: block;
    }

    .info {
      color: #5f6368;
      font-size: 0.875rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e0e0e0;
    }

    .analytics {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 2px solid #e0e0e0;
    }

    .analytics h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #202124;
    }

    .participant-count {
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .participant-count .count {
      font-size: 3rem;
      font-weight: 700;
      color: #1e8e3e;
      line-height: 1;
    }

    .participant-count .label {
      color: #5f6368;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .history h3 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
      color: #202124;
    }

    .session-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .session-item {
      background: #f8f9fa;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-item.active {
      background: #e6f4ea;
      border-left: 3px solid #1e8e3e;
    }

    .session-date {
      font-size: 0.875rem;
      color: #5f6368;
    }

    .session-participants {
      font-weight: 600;
      color: #202124;
    }

    .no-sessions {
      color: #5f6368;
      font-style: italic;
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>🛠️ Event Admin</h1>

    <div id="status" class="status">
      Checking status...
    </div>

    <button id="start-btn" class="btn btn-start">
      Start Event
    </button>

    <button id="end-btn" class="btn btn-end">
      End Event
    </button>

    <div id="message" class="message"></div>

    <div class="info">
      <strong>Instructions:</strong><br>
      • Click "Start Event" to allow users to begin networking<br>
      • Click "End Event" to show closing message to all users<br>
      • Changes take effect immediately
    </div>

    <div class="analytics">
      <h2>📊 Session Analytics</h2>

      <div id="current-session" class="participant-count">
        <div class="count" id="participant-count">0</div>
        <div class="label">participants in current session</div>
      </div>

      <div class="history">
        <h3>📅 Session History</h3>
        <div id="session-list" class="session-list">
          <div class="no-sessions">No sessions yet</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { setEventState, getEventState, subscribeToEventState, createSession, endSession, getActiveSession, getPastSessions, subscribeToSessions } from './src/supabase.js';

    // Password protection
    const ADMIN_PASSWORD = import.meta.env.VITE_ADMIN_PASSWORD;
    const AUTH_KEY = 'admin_authenticated';

    // Check if already authenticated
    if (sessionStorage.getItem(AUTH_KEY) !== 'true') {
      const password = prompt('Admin password required:');
      if (password !== ADMIN_PASSWORD) {
        alert('Incorrect password');
        window.location.href = '/';
        throw new Error('Authentication failed');
      }
      sessionStorage.setItem(AUTH_KEY, 'true');
    }

    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const endBtn = document.getElementById('end-btn');
    const messageDiv = document.getElementById('message');
    const participantCountDiv = document.getElementById('participant-count');
    const sessionListDiv = document.getElementById('session-list');

    let currentState = null;
    let currentSession = null;

    // Update UI based on state
    function updateUI(isActive) {
      currentState = isActive;

      if (isActive) {
        statusDiv.className = 'status active';
        statusDiv.textContent = '✓ Event is active';
        startBtn.disabled = true;
        endBtn.disabled = false;
      } else {
        statusDiv.className = 'status inactive';
        statusDiv.textContent = '✕ Event has ended';
        startBtn.disabled = false;
        endBtn.disabled = true;
      }
    }

    // Show message
    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      setTimeout(() => {
        messageDiv.className = 'message';
      }, 3000);
    }

    // Load initial state
    async function loadState() {
      try {
        const state = await getEventState();
        if (state) {
          updateUI(state.is_active);
        } else {
          // No state found, default to inactive
          updateUI(false);
        }
      } catch (error) {
        console.error('Error loading state:', error);
        showMessage('Error loading event state', 'error');
      }
    }

    // Format date for display
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    // Load and display session history
    async function loadSessionHistory() {
      try {
        const sessions = await getPastSessions(10);

        if (sessions.length === 0) {
          sessionListDiv.innerHTML = '<div class="no-sessions">No sessions yet</div>';
          return;
        }

        sessionListDiv.innerHTML = sessions.map(session => `
          <div class="session-item ${session.is_active ? 'active' : ''}">
            <div>
              <div class="session-date">${formatDate(session.started_at)}</div>
              ${session.is_active ? '<div style="font-size: 0.75rem; color: #1e8e3e; font-weight: 600;">● ACTIVE</div>' : ''}
            </div>
            <div class="session-participants">${session.participants_count} participant${session.participants_count !== 1 ? 's' : ''}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading session history:', error);
      }
    }

    // Update participant count display
    async function updateParticipantCount() {
      try {
        const session = await getActiveSession();
        currentSession = session;

        if (session) {
          participantCountDiv.textContent = session.participants_count;
        } else {
          participantCountDiv.textContent = '0';
        }
      } catch (error) {
        console.error('Error updating participant count:', error);
      }
    }

    // Start event
    startBtn.addEventListener('click', async () => {
      try {
        startBtn.disabled = true;

        // Create new session
        const session = await createSession();
        if (!session) {
          showMessage('Failed to create session', 'error');
          startBtn.disabled = false;
          return;
        }

        // Set event state
        const success = await setEventState(true);
        if (success) {
          showMessage('Event started successfully!', 'success');
          updateUI(true);
          await updateParticipantCount();
          await loadSessionHistory();
        } else {
          showMessage('Failed to start event', 'error');
          startBtn.disabled = false;
        }
      } catch (error) {
        console.error('Error starting event:', error);
        showMessage('Error starting event', 'error');
        startBtn.disabled = false;
      }
    });

    // End event
    endBtn.addEventListener('click', async () => {
      if (!confirm('Are you sure you want to end the event? This will show the closing message to all users.')) {
        return;
      }

      try {
        endBtn.disabled = true;

        // End current session if exists
        if (currentSession) {
          await endSession(currentSession.id);
        }

        // Set event state
        const success = await setEventState(false);
        if (success) {
          showMessage('Event ended successfully', 'success');
          updateUI(false);
          await updateParticipantCount();
          await loadSessionHistory();
        } else {
          showMessage('Failed to end event', 'error');
          endBtn.disabled = false;
        }
      } catch (error) {
        console.error('Error ending event:', error);
        showMessage('Error ending event', 'error');
        endBtn.disabled = false;
      }
    });

    // Subscribe to real-time changes
    subscribeToEventState((newState) => {
      if (newState && newState.is_active !== undefined) {
        updateUI(newState.is_active);
      }
    });

    // Subscribe to session changes (for real-time participant count updates)
    subscribeToSessions(async (payload) => {
      // Reload participant count and history when sessions change
      await updateParticipantCount();
      await loadSessionHistory();
    });

    // Initial load
    async function init() {
      await loadState();
      await updateParticipantCount();
      await loadSessionHistory();

      // Poll for participant count updates every 5 seconds
      setInterval(updateParticipantCount, 5000);
    }

    init();
  </script>
</body>
</html>
