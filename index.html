<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Looping Humans by AI Portland - Connect with fellow AI enthusiasts">
  <title>Looping Humans by AI Portland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app"></div>

  <noscript>
    <div class="nojs-fallback">
      <div class="nojs-header">
        <h1 class="nojs-title">Looping Humans</h1>
        <p class="nojs-subtitle">by AI Portland</p>
      </div>

      <div class="nojs-content">
        <h2>Connect with Fellow AI Enthusiasts!</h2>
        <p class="nojs-instructions">JavaScript is disabled, but you can still participate:</p>

        <ol class="nojs-steps">
          <li>Pick one of the emojis below</li>
          <li>Find someone else with the same emoji</li>
          <li>Choose a conversation prompt together</li>
          <li>Enjoy your conversation!</li>
        </ol>

        <h3>Match Emojis</h3>
        <div class="nojs-tokens">
          <span class="nojs-token">🤖</span>
          <span class="nojs-token">⚡</span>
          <span class="nojs-token">💡</span>
          <span class="nojs-token">🔍</span>
          <span class="nojs-token">🧠</span>
          <span class="nojs-token">📡</span>
          <span class="nojs-token">🪄</span>
          <span class="nojs-token">🧩</span>
          <span class="nojs-token">🎛️</span>
          <span class="nojs-token">📎</span>
          <span class="nojs-token">🛰️</span>
          <span class="nojs-token">📝</span>
          <span class="nojs-token">🎯</span>
          <span class="nojs-token">🔬</span>
          <span class="nojs-token">🎨</span>
          <span class="nojs-token">🚀</span>
          <span class="nojs-token">💻</span>
          <span class="nojs-token">🔮</span>
        </div>

        <h3>Conversation Prompts</h3>
        <ul class="nojs-prompts">
          <li>"Share one AI tool you used recently and what you thought about it."</li>
          <li>"What's a silly AI myth you hear all the time?"</li>
          <li>"Talk about one workflow you've improved with AI."</li>
          <li>"What AI topic are you curious about but haven't explored yet?"</li>
          <li>"Share a creative use of AI you've seen or tried."</li>
          <li>"How do you think AI will change your industry in the next year?"</li>
          <li>"What would you build if you had unlimited AI resources?"</li>
          <li>"Share your most controversial AI opinion."</li>
        </ul>
      </div>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
